name: Production & Staging Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      release_notes:
        description: 'Optional release summary'
        required: false
        default: 'Automated verified release'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Full Quality Gate & Production Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: ${{ inputs.target_env || 'production' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Gate 1 — Strict TypeScript Check
        run: npx tsc --noEmit

      - name: Gate 2 — Full Vitest Suite (All Modules)
        run: npx vitest run

      - name: Gate 3 — RLS Migration Integrity Check
        run: |
          for f in supabase/migrations/*.sql; do
            if grep -qi "CREATE TABLE" "$f" && ! grep -qi "ROW LEVEL SECURITY" "$f"; then
              echo "::warning file=$f::Migration creates tables without explicit ROW LEVEL SECURITY statement."
            fi
          done

      - name: Gate 4 — Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Verified Dist Artifact (14 days)
        uses: actions/upload-artifact@v4
        with:
          name: kas-erp-dist-${{ inputs.target_env || 'production' }}-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            ## Verified Production Release (${{ github.ref_name }})
            - Strict TypeScript (`tsc --noEmit`): Passed
            - Full Automated Test Suite (`vitest run`): Passed
            - Production Bundle (`npm run build`): Verified
