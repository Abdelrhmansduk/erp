name: Cloudflare Pages Deploy (kas-erp.com)

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target Cloudflare Pages branch (main = Production kas-erp.com, staging = Preview)'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - staging

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-cloudflare-pages:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Check Cloudflare Credentials
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### Cloudflare Pages GitHub Actions Deploy Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "If you connected Cloudflare Pages natively to GitHub (`khalid-group-12/kas-erp`), deployments run automatically inside Cloudflare." >> "$GITHUB_STEP_SUMMARY"
            echo "To deploy directly from GitHub Actions instead, add `CLOUDFLARE_API_TOKEN` and `CLOUDFLARE_ACCOUNT_ID` in Repository Secrets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        if: steps.cf_check.outputs.configured == 'true'
        run: npm ci --legacy-peer-deps

      - name: TypeScript & Unit Gate
        if: steps.cf_check.outputs.configured == 'true'
        run: npx tsc --noEmit && npx vitest run src/services/wms/wmsEngineService.test.ts

      - name: Build Production Bundle
        if: steps.cf_check.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        if: steps.cf_check.outputs.configured == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=kas-erp --branch=${{ inputs.branch || github.ref_name }}

      - name: Post-Deploy Edge Health Check
        if: steps.cf_check.outputs.configured == 'true' && github.ref == 'refs/heads/main'
        run: |
          sleep 5
          curl -fsSL https://kas-erp.com/api/health || echo "::warning::Edge health check pending DNS/SSL propagation on kas-erp.com"
